<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="492" height="492" x="10" y="10" rx="100" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
  
  <!-- Graduation Cap -->
  <path d="M256 120 L420 200 L256 280 L92 200 Z" fill="url(#accent)" filter="url(#glow)"/>
  <path d="M150 240 L150 320 C150 360 362 360 362 320 L362 240" fill="none" stroke="#c4b5fd" stroke-width="18" stroke-linecap="round"/>
  <!-- Tassel -->
  <path d="M380 220 L380 340 L395 355 L365 355 Z" fill="#fbbf24"/>
  <!-- AI Sparkle Core -->
  <circle cx="256" cy="200" r="16" fill="#ffffff"/>
  <!-- Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CAMPUSPILOT</text>
</svg>
